<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock General — Bebidas</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B1B18'/%3E%3Ctext x='16' y='21' font-family='sans-serif' font-weight='700' font-size='13' fill='%23A32B1F' text-anchor='middle'%3ETR%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}?v={{ v('estilos.css') }}">
</head>
<body>
  <header class="barra-superior">
    <div class="marca">
      <div class="marca-icono" aria-hidden="true">TOTAL</div>
      <div class="marca-texto">
        <h1>Stock General</h1>
        <span class="marca-empresa">Bebidas</span>
      </div>
    </div>
    <div class="info-actualizacion">
      <span id="fecha-actualizacion">Cargando...</span>
    </div>
  </header>

  <main class="contenedor">
    <div class="barra-filtros">
      <div class="filtro filtro-buscador">
        <label for="filtro-buscador">Buscar por código o descripción</label>
        <input id="filtro-buscador" type="text" placeholder="Ej.: 100234 o gaseosa cola">
      </div>
    </div>

    <div class="tabla-card">
      <div class="tabla-toolbar">
        <div>
          <h2 class="tabla-toolbar-titulo">Stock por código</h2>
          <p class="tabla-toolbar-subtitulo" id="tabla-subtitulo"></p>
        </div>
        <div class="tabla-toolbar-acciones">
          <button id="btn-exportar-excel" type="button" class="btn-primario">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 19h16"/></svg>
            Exportar a Excel
          </button>
        </div>
      </div>
      <div class="tabla-scroll">
        <table id="tabla-stock-general">
          <thead id="encabezado-tabla">
          </thead>
          <tbody id="cuerpo-tabla">
            <tr><td>Cargando artículos...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <footer id="totales" class="totales"></footer>
  </main>

  <script src="{{ url_for('static', filename='stock_general.js') }}?v={{ v('stock_general.js') }}"></script>
</body>
</html>
